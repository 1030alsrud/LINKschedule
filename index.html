<!doctype html>
<html lang="ko">
<head>

<title>선거운동기간 시간표</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; background: #fff; color: #000;
    font-family: "Malgun Gothic", Arial, sans-serif; font-size: 15px;
  }
  .wrap { display: flex; gap: 40px; align-items: flex-start; }
  table { border-collapse: collapse; table-layout: fixed; }
  td {
    border: 1px solid #000; padding: 4px 6px; text-align: center;
    vertical-align: middle; line-height: 1.5; height: 29px;
  }
  .left { width: 416px; }
  .left table { width: 100%; }
  .spacer { height: 29px; }
  .mic-title { background: #efd0ee; height: 58px; }
  .gap td { border: 0; height: 29px; }
  .legend { width: 112px; }
  .legend table { width: 100%; }
  .schedules { display: flex; flex-direction: column; gap: 28px; }
  .day { border: 2px solid #000; }
  .day .lb { width: 116px; }
  .day .place { height: 58px; }
  .day .tl { text-align: left; }
  .p { background: #fbe0d4; }
  .c { background: #daf0d4; }

  /* 이름 클릭 기능 */
  td.staff { cursor: pointer; }
  td.staff:hover { outline: 2px solid #888; }
  td.hl { background: #ffe58a !important; }
  #my-panel {
    position: fixed; right: 12px; bottom: 12px; width: 340px;
    max-height: 70vh; overflow: auto; background: #fff;
    border: 2px solid #000; padding: 10px; z-index: 10; font-size: 14px;
  }
  #my-panel[hidden] { display: none; }
  #my-panel .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #my-panel ul { margin: 4px 0 10px; padding-left: 18px; line-height: 1.6; }
</style>
</head>
