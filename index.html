<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>선거운동기간 시간표</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      color: #111;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f5f5f5;
    }

    .page {
      max-width: 1500px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 24px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .legend-color {
      width: 18px;
      height: 18px;
      border: 1px solid #aaa;
    }

    .picket-color { background: #f8dfd2; }
    .class-color { background: #d9f0d1; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 20px;
      align-items: start;
    }

    .day-card,
    .side-card {
      margin-bottom: 20px;
      border: 1px solid #222;
      background: white;
    }

    .day-title {
      padding: 8px;
      border-bottom: 1px solid #222;
      text-align: center;
      font-weight: bold;
      background: #fafafa;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      table-layout: fixed;
      background: white;
    }

    th, td {
      padding: 7px 5px;
      border: 1px solid #222;
      text-align: center;
      vertical-align: middle;
      font-size: 14px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    th {
      font-weight: normal;
      background: #fafafa;
    }

    .label-col { width: 100px; }
    .time-cell { white-space: nowrap; }
    .classroom { background: #d9f0d1; }
    .picket { background: #f8dfd2; }
    .empty { color: #555; }
    .staff-label {
      font-weight: bold;
      background: #fafafa;
    }

    .side-card h2 {
      margin: 0;
      padding: 10px;
      border-bottom: 1px solid #222;
      text-align: center;
      font-size: 17px;
      background: #f1d2ef;
    }

    .side-content { padding: 12px; }

    .event {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #bbb;
    }

    .event:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: 0;
    }

    .event-date {
      margin-bottom: 5px;
      font-weight: bold;
    }

    .event-place { margin-bottom: 5px; }
    .event-people { color: #333; line-height: 1.6; }

    @media (max-width: 900px) {
      body { padding: 12px; }
      .layout { grid-template-columns: 1fr; }
      .side-card { order: 2; }
    }
  </style>
</head>
