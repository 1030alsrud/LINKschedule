<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>선거운동기간 시간표</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      color: #111;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #fff;
    }

    .sheet {
      display: grid;
      grid-template-columns: minmax(680px, 1fr) 370px;
      gap: 24px;
      max-width: 1900px;
      margin: 0 auto;
      align-items: start;
    }

    .main {
      min-width: 0;
    }

    .topline {
      display: grid;
      grid-template-columns: 1fr 1fr 110px;
      text-align: center;
      border: 1px solid #111;
      margin-bottom: 10px;
    }

    .topline > div {
      padding: 7px;
      border-right: 1px solid #111;
    }

    .topline > div:last-child { border-right: 0; }

    .legend {
      display: grid;
      grid-template-columns: 110px 1fr;
      width: 260px;
      margin: 0 0 12px auto;
      border: 1px solid #111;
      text-align: center;
    }

    .legend div { padding: 6px; }
    .picket-bg { background: #f9dfd3; }
    .class-bg { background: #d9efd2; }
    .pink-bg { background: #f0c8ee; }

    .day {
      margin: 0 0 18px;
      border: 1px solid #111;
      page-break-inside: avoid;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid #111;
      padding: 5px 4px;
      text-align: center;
      vertical-align: middle;
      font-weight: normal;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .day-name { font-weight: bold; }
    .label { width: 105px; }
    .time { white-space: nowrap; font-size: 13px; }
    .place { min-height: 42px; }
    .staff-label { width: 105px; }
    .picket { background: #f9dfd3; }
    .classroom { background: #d9efd2; }
    .empty { background: #fff; }

    .aside {
      border: 1px solid #111;
    }

    .aside-title {
      padding: 15px 8px;
      text-align: center;
      background: #f0c8ee;
      border-bottom: 1px solid #111;
      font-size: 18px;
    }

    .event {
      border-bottom: 1px solid #111;
      text-align: center;
    }
