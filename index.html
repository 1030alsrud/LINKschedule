<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>선거운동 실무 일정표</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      color: #222;
      background: #f5f6f8;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .period { margin-bottom: 14px; font-size: 16px; }
    .legend { display: flex; gap: 8px; margin-bottom: 16px; }
    .legend span { padding: 5px 10px; border: 1px solid #aaa; }
    .picket { background: #fbe0d3; }
    .classroom { background: #dcf0d3; }

    .people {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 14px 0;
    }
    button {
      padding: 7px 12px;
      border: 1px solid #888;
      border-radius: 5px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }
    button.active { color: white; background: #245c9b; border-color: #245c9b; }

    .result {
      display: none;
      margin: 16px 0;
      padding: 14px;
      border: 2px solid #245c9b;
      background: white;
    }
    .result.show { display: block; }
    .result h2 { margin: 0 0 10px; font-size: 18px; }
    .result-day { margin: 12px 0; }
    .result-day h3 { margin: 0 0 6px; font-size: 16px; }
    .result-item {
      padding: 7px 0;
      border-top: 1px solid #ddd;
      line-height: 1.6;
    }
    .date { color: #c62828; font-weight: bold; }

    .day { margin: 20px 0 28px; }
    .day h2 { margin: 0; padding: 8px; text-align: center; background: #e9edf3; }
    .table-wrap { overflow-x: auto; background: white; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td {
      padding: 7px;
      border: 1px solid #555;
      text-align: center;
      vertical-align: middle;
      white-space: pre-line;
      font-size: 14px;
    }
    th { background: #f4f4f4; }
    td.picket-cell { background: #fbe0d3; }
    td.classroom-cell { background: #dcf0d3; }
    td.selected { outline: 3px solid #f2bc25; outline-offset: -3px; }
    .small { color: #555; font-size: 12px; }

    .mic { margin-top: 28px; }
    .mic h2 { padding: 8px; text-align: center; background: #efd2ee; }
    .mic-item {
      padding: 10px;
      border: 1px solid #777;
      border-top: 0;
      background: white;
      line-height: 1.7;
    }
    .mic-item.selected { background: #fff2bf; }
    @media (max-width: 600px) {
      body { padding: 10px; }
      h1 { font-size: 19px; }
    }
  </style>
</head>
<body>
  <h1>선거운동 실무 일정표</h1>
  <div class="period">선거운동기간 11/9(월) ~ 11/23(월)</div>
  <div class="legend">
    <span class="picket">피켓 유세</span>
    <span class="classroom">강의실 유세</span>
  </div>

  <p>이름을 선택하면 해당 인원의 장소가 있는 일정만 결과표에 표시됩니다.</p>
  <div class="people" id="people"></div>
  <section class="result" id="result"></section>
  <main id="schedules"></main>
  <section class="mic" id="mic"></section>

<script>
const schedules = [
  {
    day: "월요일",
    dates: ["11/9", "11/16"],
    times: ["8:30~8:40", "8:40~8:50", "8:50~9:00", "12:30~12:40", "12:40~12:50", "12:50~13:00"],
    places: [
      ["-", "-"],
      ["화학교재 및 연구법\n606-221", "-"],
      ["국문학원전이해\n701-305", "영어작문연습\n701-102"],
      ["배드민턴(경기전략과지도법)\n706-106", "-"],
      ["중급한국무용의이론과실제\n706-103", "-"],
      ["체조(마루운동)\n511-101", "-"]
    ],
    types: ["", "classroom", "classroom", "classroom", "classroom", "classroom"],
    staff: [
      ["지영", "지영"],
      ["수연", "수연"],
      ["지민", "지민"],
      ["찬영", "찬영"],
      ["시현", "시현"],
      ["", ""]
    ],
    changes: {
      "12:30~12:40": { "11/9": "주현", "11/16": "은지" },
      "12:50~13:00": { "11/9": "수연", "11/16": "" }
    }
  },
  {
    day: "화요일",
    dates: ["11/10", "11/17"],
    times: ["8:30~8:40", "8:40~8:50", "8:50~9:00", "9:30~9:40", "9:40~9:50", "14:30~14:40", "14:40~14:50"],
    places: [
      ["-", "416 피켓"],
      ["응용영어음운론\n701-102", "면역학\n416-109"],
      ["기하학일반및지도\n607-109", "-"],
      ["-", "-"],
      ["-", "-"],
      ["교육철학및교육사\n206-11301-1", "특수교육학개론\n422-411"],
      ["교육학개론\n206-11301-2", "관광여가지리학\n417-510"]
    ],
    types: ["", "classroom", "classroom", "", "", "classroom", "classroom"],
    staff: [
      ["지영", "지영"],
      ["수연", "수연"],
      ["지호", "지호"],
      ["", ""],
      ["", ""],
      ["지민", "지민"],
      ["찬영", "찬영"],
      ["윤서", "윤서"],
      ["주현", "주현"]
    ]
  },
  {
    day: "수요일",
    dates: ["11/11", "11/18"],
    times: ["8:30~8:40", "8:40~8:50", "8:50~9:00", "10:00~10:10", "10:10~10:20", "12:50~13:00", "13:00~13:10", "13:10~13:20"],
    places: [
      ["701 피켓", "-"],
      ["영어교육문법\n701-105", "309 피켓"],
      ["일반화학\n606-209", "일반물리학\n309-403"],
      ["의사소통장애학생교육\n422-409", "동아시아근세사교육\n418-204"],
      ["동양한국윤리입문\n417-303", "서양사입문\n417-407"],
      ["-", "-"],
      ["-", "-"],
      ["아동건강교육\n211-303", "-"]
    ],
    types: ["picket", "classroom", "classroom", "classroom", "classroom", "", "", "classroom"],
    staff: [
      ["지영", "지영"],
      ["지민", "지민"],
      ["하원", "하원"],
      ["찬영", "찬영"],
      ["승훈", "승훈"],
      ["지영", "지영"],
      ["승훈", "승훈"],
      ["하원", "하원"],
      ["찬영", "찬영"],
      ["금비", "금비"],
      ["은지", "주현"],
      ["수연", "수연"],
      ["지민", "지민"],
      ["유비", "유비"],
      ["은지", "은지"]
    ]
  },
  {
    day: "목요일",
    dates: ["11/12", "11/19"],
    times: ["8:30~8:40", "8:40~8:50", "8:50~9:00", "12:20~12:30", "12:30~12:40", "12:40~12:50"],
    places: [
      ["701 피켓", "422 피켓"],
      ["독서교육론\n701-303", "특수교육교사론\n422-411"],
      ["현대소설론\n701-302", "인구및자원지리학\n417-510"],
      ["-", "-"],
      ["-", "-"],
      ["-", "-"]
    ],
    types: ["picket", "classroom", "classroom", "", "", ""],
    staff: [
      ["지영", "지영"],
      ["수연", "수연"],
      ["윤서", "윤서"],
      ["승훈", "승훈"],
      ["주현", "주현"],
      ["지영", "지영"],
      ["수연", "수연"],
      ["지민", "지민"],
      ["찬영", "찬영"],
      ["하원", "하원"]
    ]
  }
];

const microphones = [
  {
    date: "11/10(화)", time: "13:00~13:10", place: "제2사범관 앞",
    people: ["지영", "수연", "지민", "재윤", "찬영", "승훈", "민경"]
  },
  {
    date: "11/18(수)", time: "16:40~16:50", place: "제1사범관 앞",
    people: ["지영", "수연", "지민", "시현", "재윤", "은지", "금비", "서영", "유비", "주현", "찬영", "민경"]
  },
  {
    date: "11/23(월)", time: "13:00~13:10", place: "제1사범관 앞",
    people: ["지영", "수연", "지민", "시현", "재윤", "은지", "금비", "서영", "유비", "주현", "승훈", "민경", "지호"]
  }
];

let selected = "";
try { selected = localStorage.getItem("selectedPerson") || ""; } catch (e) {}

function staffAt(day, timeIndex, dateIndex) {
  const date = day.dates[dateIndex];
  const override = day.changes?.[day.times[timeIndex]]?.[date];
  if (override !== undefined) return override;

  const row = day.staff[timeIndex];
  if (!row) return "";
  return row[dateIndex] || "";
}

function renderPeople() {
  const people = new Set();

  schedules.forEach(day => {
    day.staff.forEach((_, timeIndex) => {
      day.dates.forEach((_, dateIndex) => {
        const name = staffAt(day, timeIndex, dateIndex);
        if (name) people.add(name);
      });
    });
  });
  microphones.forEach(item => item.people.forEach(name => people.add(name)));

  document.getElementById("people").innerHTML =
    `<button data-person="">전체</button>` +
    [...people].sort((a, b) => a.localeCompare(b, "ko"))
      .map(name => `<button data-person="${name}">${name}</button>`).join("");

  document.querySelectorAll("#people button").forEach(button => {
    button.classList.toggle("active", button.dataset.person === selected);
    button.addEventListener("click", () => {
      selected = button.dataset.person;
      try { localStorage.setItem("selectedPerson", selected); } catch (e) {}
      render();
    });
  });
}

function renderDay(day) {
  let html = `<section class="day"><h2>${day.day} (${day.dates.join(" / ")})</h2>
    <div class="table-wrap"><table><thead><tr><th>시간</th>`;

  day.times.forEach(time => html += `<th>${time}</th>`);
  html += `</tr><tr><th>장소</th>`;

  day.places.forEach((places, i) => {
    const type = day.types[i] === "picket" ? "picket-cell" :
                 day.types[i] === "classroom" ? "classroom-cell" : "";
    html += `<td class="${type}">${day.dates[0]}: ${places[0]}<br>${day.dates[1]}: ${places[1]}</td>`;
  });

  html += `</tr></thead><tbody>`;

  const maxRows = Math.max(...day.times.map((_, i) =>
    Math.max(
      day.staff[i] ? 1 : 0,
      day.staff[i + day.times.length] ? 1 : 0,
      day.staff[i + day.times.length * 2] ? 1 : 0
    )
  ));

  for (let row = 0; row < maxRows; row++) {
    html += `<tr><th>실무 인원</th>`;
    day.times.forEach((_, timeIndex) => {
      const person = staffAt(day, timeIndex, 0);
      const second = staffAt(day, timeIndex, 1);
      const isSelected = selected && (person === selected || second === selected);
      html += `<td class="${isSelected ? "selected" : ""}">${person || "—"}<br>${second || "—"}</td>`;
    });
    html += `</tr>`;
    break;
  }

  html += `</tbody></table></div>
    <div class="small">각 칸은 위에서부터 ${day.dates[0]}, ${day.dates[1]} 일정입니다.</div>
    </section>`;
  return html;
}

function renderResult() {
  const box = document.getElementById("result");
  if (!selected) {
    box.className = "result";
    box.innerHTML = "";
    return;
  }

  let html = `<h2>${selected} 님 결과표</h2>`;
  let found = false;

  schedules.forEach(day => {
    const items = [];

    day.times.forEach((time, timeIndex) => {
      day.dates.forEach((date, dateIndex) => {
        const place = day.places[timeIndex][dateIndex];
        const person = staffAt(day, timeIndex, dateIndex);

        // 해당 날짜에 장소가 없거나 선택한 사람이 아니면 결과표에서 제외
        if (!place || place === "-" || person !== selected) return;

        items.push(
          `<div class="result-item"><span class="date">${date} (${day.day})</span> · ` +
          `${time} · ${place.replace(/\n/g, " ")}</div>`
        );
        found = true;
      });
    });

    if (items.length) {
      html += `<div class="result-day"><h3>${day.day}</h3>${items.join("")}</div>`;
    }
  });

  const micItems = microphones
    .filter(item => item.people.includes(selected))
    .map(item => {
      found = true;
      return `<div class="result-item"><span class="date">${item.date}</span> · 야외 마이크 유세 · ${item.time} · ${item.place}</div>`;
    });

  if (micItems.length) {
    html += `<div class="result-day"><h3>야외 마이크 유세</h3>${micItems.join("")}</div>`;
  }

  if (!found) html += "<p>표에 표시된 일정이 없습니다.</p>";
  box.className = "result show";
  box.innerHTML = html;
}

function renderMic() {
  let html = `<h2>야외 마이크 유세</h2>`;
  microphones.forEach(item => {
    const included = !selected || item.people.includes(selected);
    html += `<div class="mic-item ${selected && included ? "selected" : ""}">
      <strong>${item.date} ${item.time} · ${item.place}</strong><br>
      ${item.people.join(", ")}
    </div>`;
  });
  document.getElementById("mic").innerHTML = html;
}

function render() {
  renderPeople();
  renderResult();
  document.getElementById("schedules").innerHTML = schedules.map(renderDay).join("");
  renderMic();
}

render();
</script>
</body>
</html>
