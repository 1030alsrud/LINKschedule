<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>선거운동 실무 일정표</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      color: #222;
      background: #f5f6f8;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    h1 { margin: 0 0 6px; font-size: 22px; }
    .period { margin-bottom: 14px; }

    .legend {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }

    .legend span {
      padding: 5px 10px;
      border: 1px solid #aaa;
    }

    .picket { background: #fbe0d3; }
    .classroom { background: #dcf0d3; }

    .people {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 14px 0;
    }

    button {
      padding: 7px 12px;
      border: 1px solid #888;
      border-radius: 5px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }

    button.active {
      color: white;
      background: #245c9b;
      border-color: #245c9b;
    }

    .result {
      display: none;
      margin: 16px 0 22px;
      padding: 14px;
      border: 2px solid #245c9b;
      background: white;
    }

    .result.show { display: block; }
    .result h2 { margin: 0 0 10px; font-size: 18px; }
    .result-day { margin-top: 14px; }
    .result-day h3 { margin: 0 0 6px; font-size: 16px; }

    .result-item {
      padding: 7px 0;
      border-top: 1px solid #ddd;
      line-height: 1.6;
    }

    /* 개인 일정의 날짜는 검은색 */
    .result-date {
      color: #111;
      font-weight: bold;
    }

    .day { margin: 22px 0 30px; }
    .day h2 {
      margin: 0;
      padding: 8px;
      text-align: center;
      background: #e9edf3;
    }

    .table-wrap { overflow-x: auto; background: white; }

    table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
    }

    th, td {
      padding: 7px;
      border: 1px solid #555;
      text-align: center;
      vertical-align: middle;
      white-space: pre-line;
      font-size: 14px;
    }

    th { background: #f4f4f4; }
    td.picket-cell { background: #fbe0d3; }
    td.classroom-cell { background: #dcf0d3; }

    td.selected {
      outline: 3px solid #f2bc25;
      outline-offset: -3px;
    }

    .small { color: #555; font-size: 12px; }

    .mic { margin-top: 28px; }
    .mic h2 {
      padding: 8px;
      text-align: center;
      background: #efd2ee;
    }

    .mic-item {
      padding: 10px;
      border: 1px solid #777;
      border-top: 0;
      background: white;
      line-height: 1.7;
    }

    .mic-item.selected { background: #fff2bf; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      h1 { font-size: 19px; }
    }
  </style>
</head>

  <main id="schedules"></main>

    place: "제1사범관 앞",
    people: ["지영","수연","지민","시현","재윤","은지","금비","서영","유비","주현","찬영","민경"]
  },

    place: "제1사범관 앞",
    people: ["지영","수연","지민","시현","재윤","은지","금비","서영","유비","주현","승훈","민경","지호"]
  }
];

let selected = "";
try {
  selected = localStorage.getItem("selectedPerson") || "";
} catch (error) {}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function getPeople() {
  const people = new Set();

  schedules.forEach(day => {
    day.staff.forEach(timeStaff => {
      timeStaff.forEach(dateStaff => {
        dateStaff.forEach(name => {
          if (name) people.add(name);
        });
      });
    });
  });

  microphones.forEach(item => item.people.forEach(name => people.add(name)));
  return [...people].sort((a, b) => a.localeCompare(b, "ko"));
}

function renderPeople() {
  const names = getPeople();
  const container = document.getElementById("people");

  container.innerHTML =
    `<button data-person="">전체</button>` +
    names.map(name =>
      `<button data-person="${escapeHTML(name)}">${escapeHTML(name)}</button>`
    ).join("");

  container.querySelectorAll("button").forEach(button => {
    button.classList.toggle("active", button.dataset.person === selected);

    button.addEventListener("click", () => {
      selected = button.dataset.person;

      try {
        localStorage.setItem("selectedPerson", selected);
      } catch (error) {}

      render();
    });
  });
}

function renderResult() {
  const box = document.getElementById("result");

  if (!selected) {
    box.className = "result";
    box.innerHTML = "";
    return;
  }

  let html = `<h2>${escapeHTML(selected)} 님 참여 일정</h2>`;
  let found = false;

  schedules.forEach(day => {
    const items = [];

    day.times.forEach((time, timeIndex) => {
      day.dates.forEach((date, dateIndex) => {
        const place = day.places[timeIndex][dateIndex];
        const names = day.staff[timeIndex][dateIndex] || [];

        // 그 날짜 장소가 '-'이면 개인 일정에 표시하지 않음
        if (!place || place === "-" || !names.includes(selected)) return;

        items.push(
          `<div class="result-item">
            <span class="result-date">${escapeHTML(date)} (${escapeHTML(day.day)})</span>
            · ${escapeHTML(time)}
            · ${escapeHTML(place).replace(/\n/g, " ")}
          </div>`
        );
        found = true;
      });
    });

    if (items.length) {
      html += `<div class="result-day"><h3>${escapeHTML(day.day)}</h3>${items.join("")}</div>`;
    }
  });

  const micItems = microphones
    .filter(item => item.people.includes(selected))
    .map(item => {
      found = true;
      return `<div class="result-item">
        <span class="result-date">${escapeHTML(item.date)}</span>
        · 야외 마이크 유세 · ${escapeHTML(item.time)} · ${escapeHTML(item.place)}
      </div>`;
    });

  if (micItems.length) {
    html += `<div class="result-day"><h3>야외 마이크 유세</h3>${micItems.join("")}</div>`;
  }

  if (!found) html += "<p>표에 표시된 일정이 없습니다.</p>";

  box.className = "result show";
  box.innerHTML = html;
}

function renderDay(day) {
  let html = `
    <section class="day">
      <h2>${escapeHTML(day.day)} (${day.dates.join(" / ")})</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>시간</th>
              ${day.times.map(time => `<th>${escapeHTML(time)}</th>`).join("")}
            </tr>
            <tr>
              <th>날짜·장소</th>
              ${day.times.map((_, i) => {
                const type = day.types[i] === "picket"
                  ? "picket-cell"
                  : day.types[i] === "classroom"
                    ? "classroom-cell"
                    : "";

                return `<td class="${type}">
                  ${escapeHTML(day.dates[0])}: ${escapeHTML(day.places[i][0])}<br>
                  ${escapeHTML(day.dates[1])}: ${escapeHTML(day.places[i][1])}
                </td>`;
              }).join("")}
            </tr>
          </thead>
          <tbody>`;

  const rowCount = Math.max(
    ...day.staff.flatMap(timeStaff => timeStaff.map(names => names.length))
  );

  for (let row = 0; row < rowCount; row++) {
    html += `<tr><th>실무 인원 ${row + 1}</th>`;

    day.staff.forEach(timeStaff => {
      const firstDateName = timeStaff[0][row] || "—";
      const secondDateName = timeStaff[1][row] || "—";
      const isSelected =
        selected &&
        (firstDateName === selected || secondDateName === selected);

      html += `<td class="${isSelected ? "selected" : ""}">
        ${escapeHTML(firstDateName)}<br>${escapeHTML(secondDateName)}
      </td>`;
    });

    html += "</tr>";
  }

  html += `
          </tbody>
        </table>
      </div>
      <div class="small">각 인원 칸은 위에서부터 ${escapeHTML(day.dates[0])}, ${escapeHTML(day.dates[1])} 순서입니다.</div>
    </section>`;

  return html;
}

function renderMic() {
  let html = "<h2>야외 마이크 유세</h2>";

  microphones.forEach(item => {
    const isSelected = selected && item.people.includes(selected);
    html += `
      <div class="mic-item ${isSelected ? "selected" : ""}">
        <strong>${escapeHTML(item.date)} ${escapeHTML(item.time)} · ${escapeHTML(item.place)}</strong><br>
        ${item.people.map(name =>
          name === selected ? `<strong>${escapeHTML(name)}</strong>` : escapeHTML(name)
        ).join(", ")}
      </div>`;
  });

  document.getElementById("mic").innerHTML = html;
}

function render() {
  renderPeople();
 function renderResult() {
  const box = document.getElementById("result");

  if (!selected) {
    box.className = "result";
    box.innerHTML = "";
    return;
  }

  let html = `<h2>${escapeHTML(selected)} 님 참여 일정</h2>`;
  let found = false;

  // "8:30~8:40" 같은 시간의 시작 시각을 분 단위로 변환
  function startMinutes(time) {
    const match = time.match(/^(\d{1,2}):(\d{2})/);
    return match ? Number(match[1]) * 60 + Number(match[2]) : 0;
  }

  schedules.forEach(day => {
    const dateSections = [];

    // 날짜를 먼저 나누고, 각 날짜 안에서 시간순으로 표시
    day.dates.forEach((date, dateIndex) => {
      const items = day.times
        .map((time, timeIndex) => {
          const place = day.places[timeIndex][dateIndex];
          const names = day.staff[timeIndex][dateIndex] || [];

          if (!place || place === "-" || !names.includes(selected)) {
            return null;
          }

          return { time, place, timeIndex };
        })
        .filter(Boolean)
        .sort((a, b) => startMinutes(a.time) - startMinutes(b.time));

      if (!items.length) return;

      found = true;
      dateSections.push(`
        <div class="result-day">
          <h3 class="result-date">${escapeHTML(date)}</h3>
          ${items.map(item => `
            <div class="result-item">
              ${escapeHTML(item.time)} ·
              ${escapeHTML(item.place).replace(/\n/g, " ")}
            </div>
          `).join("")}
        </div>
      `);
    });

    if (dateSections.length) {
      html += `
        <section class="weekday-section">
          <h3>${escapeHTML(day.day)}</h3>
          ${dateSections.join("")}
        </section>
      `;
    }
  });

  const micItems = microphones.filter(item =>
    item.people.includes(selected)
  );

  if (micItems.length) {
    found = true;
    html += `
      <div class="result-day">
        <h3>야외 마이크 유세</h3>
        ${micItems.map(item => `
          <div class="result-item">
            <span class="result-date">${escapeHTML(item.date)}</span> ·
            ${escapeHTML(item.time)} · ${escapeHTML(item.place)}
          </div>
        `).join("")}
      </div>
    `;
  }

  if (!found) {
    html += "<p>표에 표시된 일정이 없습니다.</p>";
  }

  box.className = "result show";
  box.innerHTML = html;
}
