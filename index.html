<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>선거운동 실무 일정표</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      color: #222;
      background: #f5f6f8;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    h1 { margin: 0 0 6px; font-size: 22px; }
    .period { margin-bottom: 14px; }

    .legend {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }

    .legend span {
      padding: 5px 10px;
      border: 1px solid #aaa;
    }

    .picket { background: #fbe0d3; }
    .classroom { background: #dcf0d3; }

    .people {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 14px 0;
    }

    button {
      padding: 7px 12px;
      border: 1px solid #888;
      border-radius: 5px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }

    button.active {
      color: white;
      background: #245c9b;
      border-color: #245c9b;
    }

    .result {
      display: none;
      margin: 16px 0 22px;
      padding: 14px;
      border: 2px solid #245c9b;
      background: white;
    }

    .result.show { display: block; }
    .result h2 { margin: 0 0 12px; font-size: 18px; }

    .weekday-section { margin-top: 16px; }

    .weekday-title {
      margin: 0 0 8px;
      padding: 6px 8px;
      background: #e9edf3;
      font-size: 16px;
    }

    .date-section { margin: 10px 0 14px 10px; }

    .date-title {
      margin: 0 0 4px;
      color: #111;
      font-size: 15px;
    }

    .result-item {
      padding: 7px 0;
      border-top: 1px solid #ddd;
      line-height: 1.6;
    }

    .day { margin: 22px 0 30px; }

    .day h2 {
      margin: 0;
      padding: 8px;
      text-align: center;
      background: #e9edf3;
    }

    .table-wrap {
      overflow-x: auto;
      background: white;
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
    }

    th, td {
      padding: 7px;
      border: 1px solid #555;
      text-align: center;
      vertical-align: middle;
      white-space: pre-line;
      font-size: 14px;
    }

    th { background: #f4f4f4; }
    td.picket-cell { background: #fbe0d3; }
    td.classroom-cell { background: #dcf0d3; }

    td.selected {
      outline: 3px solid #f2bc25;
      outline-offset: -3px;
    }

    .small {
      margin-top: 5px;
      color: #555;
      font-size: 12px;
    }

    .mic { margin-top: 28px; }

    .mic h2 {
      padding: 8px;
      text-align: center;
      background: #efd2ee;
    }

    .mic-item {
      padding: 10px;
      border: 1px solid #777;
      border-top: 0;
      background: white;
      line-height: 1.7;
    }

    .mic-item.selected { background: #fff2bf; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      h1 { font-size: 19px; }
    }
  </style>
</head>
<body>
  <h1>선거운동 실무 일정표</h1>
  <div class="period">선거운동기간 11/9(월) ~ 11/23(월)</div>

  <div class="legend">
    <span class="picket">피켓 유세</span>
    <span class="classroom">강의실 유세</span>
  </div>

  <p>이름을 누르면 본인 일정이 요일·날짜별로 시간순으로 표시됩니다.</p>

  <div class="people" id="people"></div>
  <section class="result" id="result"></section>
  <main id="schedules"></main>
  <section class="mic" id="mic"></section>

<script>
const schedules = [
  {
    day: "월요일",
    dates: ["11/9", "11/16"],
    times: [
      "8:30~8:40",
      "8:40~8:50",
      "8:50~9:00",
      "12:30~12:40",
      "12:40~12:50",
      "12:50~13:00"
    ],
    places: [
      ["-", "-"],
      ["화학교재 및 연구법\n606-221", "-"],
      ["국문학원전이해\n701-305", "영어작문연습\n701-102"],
      ["배드민턴(경기전략과지도법)\n706-106", "-"],
      ["중급한국무용의이론과실제\n706-103", "-"],
      ["체조(마루운동)\n511-101", "-"]
    ],
    types: ["", "classroom", "classroom", "classroom", "classroom", "classroom"],
    staff: [
      [["지영","수연","지민","찬영","시현"], ["지영","수연","지민","찬영","시현"]],
      [["지영","수연","지민","찬영","시현"], ["지영","수연","지민","찬영","시현"]],
      [["지영","수연","지민","찬영","시현"], ["지영","수연","지민","찬영","시현"]],
      [["지영","지민","주현","서영","재윤"], ["지영","지민","은지","서영","재윤"]],
      [["지영","지민","주현","서영","재윤"], ["지영","지민","은지","서영","재윤"]],
      [["지영","지민","주현","서영","재윤","수연"], ["지영","지민","은지","서영","재윤","수연"]]
    ]
  },

  {
    day: "화요일",
    dates: ["11/10", "11/17"],
    times: [
      "8:30~8:40",
      "8:40~8:50",
      "8:50~9:00",
      "9:30~9:40",
      "9:40~9:50",
      "14:30~14:40",
      "14:40~14:50"
    ],
    places: [
      ["-", "416 피켓"],
      ["응용영어음운론\n701-102", "면역학\n416-109"],
      ["기하학일반및지도\n607-109", "-"],
      ["-", "-"],
      ["-", "-"],
      ["교육철학및교육사\n206-11301-1", "특수교육학개론\n422-411"],
      ["교육학개론\n206-11301-2", "관광여가지리학\n417-510"]
    ],
    types: ["", "classroom", "classroom", "", "", "classroom", "classroom"],
    staff: [
      [["지영","수연","지호","민경","주현"], ["지영","수연","지호","민경","주현"]],
      [["지영","수연","지호","민경","주현"], ["지영","수연","지호","민경","주현"]],
      [["지영","수연","지호","민경","주현"], ["지영","수연","지호","민경","주현"]],
      [["","수연","지호","민경","주현"], ["","수연","지호","민경","주현"]],
      [["","수연","지호","민경","주현"], ["","수연","지호","민경","주현"]],
      [["지영","지민","찬영","윤서","주현"], ["지영","지민","찬영","윤서","주현"]],
      [["지영","지민","찬영","윤서","주현"], ["지영","지민","찬영","윤서","주현"]]
    ]
  },

  {
    day: "수요일",
    dates: ["11/11", "11/18"],
    times: [
      "8:30~8:40",
      "8:40~8:50",
      "8:50~9:00",
      "10:00~10:10",
      "10:10~10:20",
      "12:50~13:00",
      "13:00~13:10",
      "13:10~13:20"
    ],
    places: [
      ["701 피켓", "-"],
      ["영어교육문법\n701-105", "309 피켓"],
      ["일반화학\n606-209", "일반물리학\n309-403"],
      ["의사소통장애학생교육\n422-409", "동아시아근세사교육\n418-204"],
      ["동양한국윤리입문\n417-303", "서양사입문 417-407"],
      ["-", "-"],
      ["-", "-"],
      ["아동건강교육\n211-303", "-"]
    ],
    types: ["picket", "classroom", "classroom", "classroom", "classroom", "", "", "classroom"],
    staff: [
      [["지영","지민","하원","찬영","승훈"], ["지영","지민","하원","찬영","승훈"]],
      [["지영","지민","하원","찬영","승훈"], ["지영","지민","하원","찬영","승훈"]],
      [["지영","지민","하원","찬영","승훈"], ["지영","지민","하원","찬영","승훈"]],
      [["지영","승훈","하원","찬영","금비"], ["지영","승훈","하원","찬영","금비"]],
      [["지영","승훈","하원","찬영","금비"], ["지영","승훈","하원","찬영","금비"]],
      [["지영","수연","지민","유비","은지"], ["지영","수연","지민","유비","주현"]],
      [["지영","수연","지민","유비","은지"], ["지영","수연","지민","유비","주현"]],
      [["지영","수연","지민","유비","은지"], ["지영","수연","지민","유비","주현"]]
    ]
  },

  {
    day: "목요일",
    dates: ["11/12", "11/19"],
    times: [
      "8:30~8:40",
      "8:40~8:50",
      "8:50~9:00",
      "12:20~12:30",
      "12:30~12:40",
      "12:40~12:50"
    ],
    places: [
      ["701 피켓", "422 피켓"],
      ["독서교육론\n701-303", "특수교육교사론\n422-411"],
      ["현대소설론\n701-302", "인구및자원지리학\n417-510"],
      ["-", "-"],
      ["-", "-"],
      ["-", "-"]
    ],
    types: ["picket", "classroom", "classroom", "", "", ""],
    staff: [
      [["지영","수연","윤서","승훈","주현"], ["지영","수연","윤서","승훈","주현"]],
      [["지영","수연","윤서","승훈","주현"], ["지영","수연","윤서","승훈","주현"]],
      [["지영","수연","윤서","승훈","주현"], ["지영","수연","윤서","승훈","주현"]],
      [["지영","수연","지민","찬영","하원"], ["지영","수연","지민","찬영","하원"]],
      [["지영","수연","지민","찬영","하원"], ["지영","수연","지민","찬영","하원"]],
      [["지영","수연","지민","찬영","하원"], ["지영","수연","지민","찬영","하원"]]
    ]
  }
];

const microphones = [
  {
    date: "11/10(화)",
    time: "13:00~13:10",
    place: "제2사범관 앞",
    people: ["지영","수연","지민","재윤","찬영","승훈","민경"]
  },
  {
    date: "11/18(수)",
    time: "16:40~16:50",
    place: "제1사범관 앞",
    people: ["지영","수연","지민","시현","재윤","은지","금비","서영","유비","주현","찬영","민경"]
  },
  {
    date: "11/23(월)",
    time: "13:00~13:10",
    place: "제1사범관 앞",
    people: ["지영","수연","지민","시현","재윤","은지","금비","서영","유비","주현","승훈","민경","지호"]
  }
];

let selected = "";

try {
  selected = localStorage.getItem("selectedPerson") || "";
} catch (error) {}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function getPeople() {
  const people = new Set();

  schedules.forEach(day => {
    day.staff.forEach(timeStaff => {
      timeStaff.forEach(dateStaff => {
        dateStaff.forEach(name => {
          if (name) people.add(name);
        });
      });
    });
  });

  microphones.forEach(item => {
    item.people.forEach(name => people.add(name));
  });

  return [...people].sort((a, b) => a.localeCompare(b, "ko"));
}

function renderPeople() {
  const container = document.getElementById("people");

  container.innerHTML =
    `<button data-person="">전체</button>` +
    getPeople().map(name =>
      `<button data-person="${escapeHTML(name)}">${escapeHTML(name)}</button>`
    ).join("");

  container.querySelectorAll("button").forEach(button => {
    button.classList.toggle("active", button.dataset.person === selected);

    button.addEventListener("click", () => {
      selected = button.dataset.person;

      try {
        localStorage.setItem("selectedPerson", selected);
      } catch (error) {}

      render();
    });
  });
}

function startMinutes(time) {
  const match = time.match(/^(\d{1,2}):(\d{2})/);
  return match ? Number(match[1]) * 60 + Number(match[2]) : 0;
}

function renderResult() {
  const box = document.getElementById("result");

  if (!selected) {
    box.className = "result";
    box.innerHTML = "";
    return;
  }

  let html = `<h2>${escapeHTML(selected)} 님 참여 일정</h2>`;
  let hasAnySchedule = false;

  schedules.forEach(day => {
    let weekdayHTML = "";

    day.dates.forEach((date, dateIndex) => {
      const items = [];

      day.times.forEach((time, timeIndex) => {
        const place = day.places[timeIndex][dateIndex];
        const names = day.staff[timeIndex][dateIndex] || [];

        if (!place || place === "-" || !names.includes(selected)) return;
        items.push({ time, place });
      });

      items.sort((a, b) => startMinutes(a.time) - startMinutes(b.time));

      if (items.length) {
        hasAnySchedule = true;
        weekdayHTML += `
          <div class="date-section">
            <h4 class="date-title">${escapeHTML(date)}</h4>
            ${items.map(item => `
              <div class="result-item">
                ${escapeHTML(item.time)} ·
                ${escapeHTML(item.place).replace(/\n/g, " ")}
              </div>
            `).join("")}
          </div>
        `;
      }
    });

    if (weekdayHTML) {
      html += `
        <section class="weekday-section">
          <h3 class="weekday-title">${escapeHTML(day.day)}</h3>
          ${weekdayHTML}
        </section>
      `;
    }
  });

  const micItems = microphones.filter(item =>
    item.people.includes(selected)
  );

  if (micItems.length) {
    hasAnySchedule = true;
    html += `
      <section class="weekday-section">
        <h3 class="weekday-title">야외 마이크 유세</h3>
        ${micItems.map(item => `
          <div class="result-item">
            <strong>${escapeHTML(item.date)}</strong> ·
            ${escapeHTML(item.time)} · ${escapeHTML(item.place)}
          </div>
        `).join("")}
      </section>
    `;
  }

  if (!hasAnySchedule) {
    html += "<p>표에 표시된 일정이 없습니다.</p>";
  }

  box.className = "result show";
  box.innerHTML = html;
}

function renderDay(day) {
  let html = `
    <section class="day">
      <h2>${escapeHTML(day.day)} (${day.dates.map(escapeHTML).join(" / ")})</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>시간</th>
              ${day.times.map(time => `<th>${escapeHTML(time)}</th>`).join("")}
            </tr>
            <tr>
              <th>${escapeHTML(day.dates[0])} 장소</th>
              ${day.times.map((_, index) => {
                const type = day.types[index] === "picket"
                  ? "picket-cell"
                  : day.types[index] === "classroom"
                    ? "classroom-cell"
                    : "";

                return `<td class="${type}">${escapeHTML(day.places[index][0])}</td>`;
              }).join("")}
            </tr>
            <tr>
              <th>${escapeHTML(day.dates[1])} 장소</th>
              ${day.times.map((_, index) => {
                const type = day.types[index] === "picket"
                  ? "picket-cell"
                  : day.types[index] === "classroom"
                    ? "classroom-cell"
                    : "";

                return `<td class="${type}">${escapeHTML(day.places[index][1])}</td>`;
              }).join("")}
            </tr>
          </thead>
          <tbody>`;

  const maxRows = Math.max(
    ...day.staff.flatMap(timeStaff =>
      timeStaff.map(dateStaff => dateStaff.length)
    )
  );

  for (let row = 0; row < maxRows; row++) {
    html += `<tr><th>실무 인원 ${row + 1}</th>`;

    day.staff.forEach(timeStaff => {
      const first = timeStaff[0][row] || "";
      const second = timeStaff[1][row] || "";

      // 두 날짜 인원이 같으면 한 명만 표시.
      // 다르면 교대 표기: 예) 주현→은지
      let displayedName = "";

      if (first && second && first === second) {
        displayedName = first;
      } else if (first && second) {
        displayedName = `${first}→${second}`;
      } else {
        displayedName = first || second || "—";
      }

      const isSelected =
        selected && (first === selected || second === selected);

      html += `
        <td class="${isSelected ? "selected" : ""}">
          ${escapeHTML(displayedName)}
        </td>
      `;
    });

    html += "</tr>";
  }

  html += `
          </tbody>
        </table>
      </div>
      <div class="small">
        교대 표기는 ${escapeHTML(day.dates[0])} → ${escapeHTML(day.dates[1])} 순서입니다.
      </div>
    </section>
  `;

  return html;
}

function renderMic() {
  let html = "<h2>야외 마이크 유세</h2>";

  microphones.forEach(item => {
    const isSelected = selected && item.people.includes(selected);

    html += `
      <div class="mic-item ${isSelected ? "selected" : ""}">
        <strong>
          ${escapeHTML(item.date)} ${escapeHTML(item.time)} ·
          ${escapeHTML(item.place)}
        </strong><br>
        ${item.people.map(name =>
          name === selected
            ? `<strong>${escapeHTML(name)}</strong>`
            : escapeHTML(name)
        ).join(", ")}
      </div>
    `;
  });

  document.getElementById("mic").innerHTML = html;
}

function render() {
  renderPeople();
  renderResult();
  document.getElementById("schedules").innerHTML =
    schedules.map(renderDay).join("");
  renderMic();
}

render();
</script>
</body>
</html>
