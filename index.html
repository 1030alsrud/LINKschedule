<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>선거운동기간 시간표</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      background: #fff;
      color: #000;
      font-family: "Malgun Gothic", Arial, sans-serif;
      font-size: 15px;
    }

    .wrap {
      display: flex;
      gap: 40px;
      align-items: flex-start;
      min-width: max-content;
    }

    table {
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid #000;
      padding: 4px 6px;
      text-align: center;
      vertical-align: middle;
      font-weight: normal;
      line-height: 1.5;
      white-space: pre-line;
      height: 29px;
    }

    /* 왼쪽 영역 */
    .left { width: 416px; }
    .left table { width: 100%; }
    .period td:first-child { width: 205px; }

    .mic-title {
      background: #efd0ee;
      height: 58px;
    }
    .gap td { border: 0; height: 29px; }
    .mic-people { height: auto; min-height: 29px; }

    /* 범례 */
    .legend { width: 112px; }
    .legend table { width: 100%; }
    .legend .picket { background: #fbe0d4; }
    .legend .class  { background: #daf0d4; }

    /* 요일 표 */
    .schedules { display: flex; flex-direction: column; gap: 28px; }

    .day-table { border: 2px solid #000; }
    .day-table col.label { width: 116px; }
    .day-table col.slot  { width: 160px; }
    .day-table th.time-label { text-align: left; }
    .day-table .place { height: 58px; }
    .day-table .staff-label { width: 116px; }

    td.picket { background: #fbe0d4; }
    td.class  { background: #daf0d4; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 왼쪽: 기간 + 야외 마이크 유세 -->
    <div class="left">
      <table class="period">
        <tr>
          <td>선거운동기간</td>
          <td>11/9(월)~11/23(월)</td>
        </tr>
      </table>

      <div style="height:29px"></div>

      <table id="mic"></table>
    </div>

    <!-- 범례 -->
    <div class="legend">
      <table>
        <tr><td class="picket">피켓 유세</td></tr>
        <tr><td class="class">강의실 유세</td></tr>
      </table>
    </div>

    <!-- 요일별 시간표 -->
    <div class="schedules" id="schedules"></div>
  </div>

          ]]
        ],

          ["지영", "지영", "지영", "지영", "지영", "지영"],
          ["수연", "수연", "수연", "지민", "지민", "지민"],
          ["지민", "지민", "지민", "주현", "주현", "주현"],
          ["찬영", "찬영", "찬영", "서영", "서영", "서영"],
          ["시현", "시현", "시현", "재윤", "재윤", "재윤"],
          ["",     "",     "",     "",     "",     "수연"]

                "9:30~9:40", "9:40~9:50",

            "특수교육학개론\n422-411",
            "관광여가지리학\n417-510"
          ]]
        ],
        staff: [
          ["지영", "지영", "지영", "-",    "-",    "지영", "지영"],
          ["수연", "수연", "수연", "수연", "수연", "지민", "지민"],
          ["지호", "지호", "지호", "지호", "지호", "찬영", "찬영"],
          ["민경", "민경", "민경", "민경", "민경", "윤서", "윤서"],

        ]

          ["하원", "하원", "하원", "하원", "하원", "지민", "지민", "지민"],

        ]
      }
    ];

    /* ---------- 렌더링 ---------- */
    function esc(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function placeClass(text) {
      if (text.includes("피켓")) return "picket";
      if (text.trim() === "-") return "";
      return "class";
    }

    function renderMic() {
      let html = `<tr><td class="mic-title" colspan="2">야외 마이크 유세</td></tr>`;

      mic.forEach((item, i) => {
        html += `
          <tr>
            <td style="width:205px">${esc(item.when)}</td>
            <td>${esc(item.where)}</td>
          </tr>
          <tr>
            <td class="mic-people" colspan="2">${esc(item.people)}</td>
          </tr>
        `;
        if (i < mic.length - 1) {
          html += `<tr class="gap"><td colspan="2"></td></tr>`;
        }
      });

      document.getElementById("mic").innerHTML = html;
    }

    function renderDay(day) {
      const n = day.times.length;
      const staffRows = day.staff.length;

      let html = `<table class="day-table">
        <colgroup>
          <col class="label">
          ${day.times.map(() => `<col class="slot">`).join("")}
        </colgroup>
        <tr>
          <td>요일</td>
          <td colspan="${n}">${esc(day.name)}</td>
        </tr>
        <tr>
          <td class="time-label">시간</td>
          ${day.times.map(t => `<td>${esc(t)}</td>`).join("")}
        </tr>
      `;

      day.places.forEach(([date, list]) => {
        html += `<tr>
          <td class="place">${esc(date)} 장소</td>
          ${list.map(p => `<td class="place ${placeClass(p)}">${esc(p)}</td>`).join("")}
        </tr>`;
      });

      day.staff.forEach((row, r) => {
        html += `
